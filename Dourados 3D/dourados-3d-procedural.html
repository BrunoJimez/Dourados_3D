<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dourados 3D — Procedural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ipe:#FFC63D; --ipe-rosa:#E96FA8; --terra:#A6402B;
    --placa:#1B6E4A; --noite:#101720; --nevoa:#F3E9D8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--noite);
    font-family:'Archivo',-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--nevoa)}
  canvas{display:block}

  /* Placa rodoviária — assinatura visual */
  .placa{
    position:fixed;top:18px;left:18px;z-index:10;
    background:var(--placa);border:3px solid #fff;border-radius:10px;
    padding:10px 18px 12px;box-shadow:0 6px 18px rgba(0,0,0,.45);
    user-select:none;
  }
  .placa h1{font-size:26px;letter-spacing:.14em;font-weight:800;color:#fff;line-height:1}
  .placa .sub{font-size:11px;letter-spacing:.08em;color:#DFF2E7;margin-top:5px}
  .placa .km{display:inline-block;margin-top:6px;font-size:10px;background:#fff;
    color:var(--placa);border-radius:4px;padding:2px 7px;font-weight:700;letter-spacing:.06em}

  .painel{
    position:fixed;z-index:10;background:rgba(16,23,32,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(243,233,216,.18);border-radius:12px;padding:12px 14px;
  }
  .painel h2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ipe);margin-bottom:9px;font-weight:700}
  #marcos{bottom:18px;left:18px}
  #marcos button{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    color:var(--nevoa);font-size:13px;padding:5px 6px;border-radius:6px;font-family:inherit;
  }
  #marcos button:hover,#marcos button:focus-visible{background:rgba(255,198,61,.16);outline:none}
  #marcos button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:8px;vertical-align:1px}

  #modos{top:18px;right:18px;display:flex;gap:8px;padding:8px}
  #modos button{
    background:rgba(243,233,216,.08);border:1px solid rgba(243,233,216,.25);
    color:var(--nevoa);font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;
    font-family:inherit;letter-spacing:.04em;
  }
  #modos button:hover{border-color:var(--ipe);color:var(--ipe)}
  #modos button.ativo{background:var(--ipe);border-color:var(--ipe);color:var(--noite);font-weight:700}

  #dica{
    position:fixed;bottom:18px;right:18px;z-index:10;font-size:11px;color:rgba(243,233,216,.65);
    background:rgba(16,23,32,.6);padding:7px 11px;border-radius:8px;letter-spacing:.03em;
  }
  #rotulo{
    position:fixed;z-index:9;pointer-events:none;font-size:12px;font-weight:700;
    color:var(--noite);background:var(--ipe);padding:3px 9px;border-radius:6px;
    transform:translate(-50%,-130%);opacity:0;transition:opacity .25s;letter-spacing:.04em;
  }
  @media(max-width:640px){
    .placa h1{font-size:19px}
    #marcos{display:none}
    #dica{display:none}
  }
  @media(prefers-reduced-motion:reduce){ .anim-off{animation:none} }
</style>
</head>
<body>

<div class="placa">
  <h1>DOURADOS</h1>
  <div class="sub">Mato Grosso do Sul · 22°13′S 54°48′W · alt. 430 m</div>
  <span class="km">PROJETO 1 · CIDADE PROCEDURAL</span>
</div>

<div class="painel" id="modos">
  <button id="btnSobrevoo">▶ Sobrevoo</button>
  <button id="btnOrbita" class="ativo">⟳ Órbita</button>
  <button id="btnLivre">✋ Livre</button>
</div>

<div class="painel" id="marcos">
  <h2>Marcos da cidade</h2>
</div>

<div id="dica">arraste: girar · scroll: zoom · botão direito: mover</div>
<div id="rotulo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
// DOURADOS 3D — geração procedural
// Malha em grade do centro, Av. Marcelino Pires, Catedral,
// Praça Antônio João, Parque do Lago, UFGD, ipês e lavouras.
// ============================================================

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 12000);

// ---------- Céu de fim de tarde no cerrado ----------
const skyGeo = new THREE.SphereGeometry(6000, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms:{ topo:{value:new THREE.Color(0x1E3A5C)},
             meio:{value:new THREE.Color(0xE8804F)},
             base:{value:new THREE.Color(0xFFC97A)} },
  vertexShader:`varying vec3 vP; void main(){ vP=position;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vP; uniform vec3 topo,meio,base;
    void main(){ float h=normalize(vP).y;
      vec3 c = h<0.12 ? mix(base,meio,smoothstep(-0.05,0.12,h))
                      : mix(meio,topo,smoothstep(0.12,0.65,h));
      gl_FragColor=vec4(c,1.0); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));
scene.fog = new THREE.FogExp2(0xEFB98A, 0.00033); // névoa dourada

// Sol baixo, a oeste
const sol = new THREE.Mesh(new THREE.SphereGeometry(90,16,16),
  new THREE.MeshBasicMaterial({color:0xFFE7B0, fog:false}));
sol.position.set(-4200, 380, 900);
scene.add(sol);

// ---------- Luz ----------
const luzSol = new THREE.DirectionalLight(0xFFD9A8, 1.35);
luzSol.position.set(-1400, 900, 400);
luzSol.castShadow = true;
luzSol.shadow.mapSize.set(2048,2048);
const S = 1500;
Object.assign(luzSol.shadow.camera,{left:-S,right:S,top:S,bottom:-S,near:100,far:4000});
luzSol.shadow.camera.updateProjectionMatrix();
scene.add(luzSol);
scene.add(new THREE.HemisphereLight(0xFFCF9E, 0x2E4A2B, 0.55));
scene.add(new THREE.AmbientLight(0x557799, 0.28));

// ---------- Parâmetros urbanos ----------
const BLOCO=100, RUA=16, PASSO=BLOCO+RUA;
const NX=15, NZ=11;                       // quarteirões (leste-oeste x norte-sul)
const LIM_X = NX*PASSO/2, LIM_Z = NZ*PASSO/2;
const AVENIDA_L = 40;                     // Av. Marcelino Pires (leste-oeste, z=0)
const AV2_X = 2*PASSO;                    // Av. Hayel Bon Faker (norte-sul)

const rnd = (()=>{ let s=22213; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; })();

// ---------- Chão ----------
const chao = new THREE.Mesh(
  new THREE.PlaneGeometry(9000,9000),
  new THREE.MeshLambertMaterial({color:0x5E7A3A})); // verde do planalto
chao.rotation.x=-Math.PI/2; chao.receiveShadow=true; chao.position.y=-0.2;
scene.add(chao);

// Asfalto do perímetro urbano
const asfalto = new THREE.Mesh(
  new THREE.PlaneGeometry(NX*PASSO+220, NZ*PASSO+220),
  new THREE.MeshLambertMaterial({color:0x3A3A40}));
asfalto.rotation.x=-Math.PI/2; asfalto.receiveShadow=true;
scene.add(asfalto);

// Quarteirões (calçada + miolo)
const zonasLivres = []; // {x,z,rx,rz} onde não nascem prédios comuns
function livre(x,z){ return zonasLivres.some(a=>Math.abs(x-a.x)<a.rx && Math.abs(z-a.z)<a.rz); }

const geoQuadra = new THREE.PlaneGeometry(BLOCO,BLOCO);
const matQuadra = new THREE.MeshLambertMaterial({color:0x8E8878});
for(let i=0;i<NX;i++) for(let j=0;j<NZ;j++){
  const x=-LIM_X+PASSO/2+i*PASSO, z=-LIM_Z+PASSO/2+j*PASSO;
  if(Math.abs(z) < AVENIDA_L/2+8) continue;           // faixa da avenida
  const q=new THREE.Mesh(geoQuadra, matQuadra);
  q.rotation.x=-Math.PI/2; q.position.set(x,0.05,z); q.receiveShadow=true;
  scene.add(q);
}

// ---------- Av. Marcelino Pires: canteiro central ----------
const canteiro = new THREE.Mesh(
  new THREE.PlaneGeometry(NX*PASSO+220, 7),
  new THREE.MeshLambertMaterial({color:0x4F7A34}));
canteiro.rotation.x=-Math.PI/2; canteiro.position.y=0.12; scene.add(canteiro);

// Faixas amarelas da avenida
const faixaMat = new THREE.MeshBasicMaterial({color:0xC9A23C});
for(const off of [-AVENIDA_L/2+4, AVENIDA_L/2-4]){
  const f=new THREE.Mesh(new THREE.PlaneGeometry(NX*PASSO+220,0.8), faixaMat);
  f.rotation.x=-Math.PI/2; f.position.set(0,0.1,off); scene.add(f);
}

// ============================================================
// ZONAS ESPECIAIS
// ============================================================

// --- Parque Antenor Martins (Parque do Lago), a oeste ---
const PQ = {x:-LIM_X+220, z:-420};
zonasLivres.push({x:PQ.x, z:PQ.z, rx:260, rz:230});
const gramaPq = new THREE.Mesh(new THREE.CircleGeometry(255,40),
  new THREE.MeshLambertMaterial({color:0x4E7C33}));
gramaPq.rotation.x=-Math.PI/2; gramaPq.position.set(PQ.x,0.15,PQ.z); gramaPq.receiveShadow=true;
scene.add(gramaPq);
const lago = new THREE.Mesh(new THREE.CircleGeometry(150,48),
  new THREE.MeshPhongMaterial({color:0x2E7DA6, specular:0xFFDDAA, shininess:120,
    transparent:true, opacity:0.94}));
lago.rotation.x=-Math.PI/2; lago.position.set(PQ.x,0.3,PQ.z); scene.add(lago);
lago.scale.setScalar(1); lago.geometry.scale(1.25,0.8,1); // lago alongado

// --- Praça Antônio João (centro) ---
const PR = {x:-PASSO/2-BLOCO/2, z:-PASSO+ -BLOCO/2 + PASSO}; // quadra ao norte da avenida
PR.x = -PASSO/2 - 8; PR.z = -(AVENIDA_L/2 + 8 + BLOCO/2);
zonasLivres.push({x:PR.x, z:PR.z, rx:70, rz:70});
const praca = new THREE.Mesh(new THREE.PlaneGeometry(BLOCO+10,BLOCO+10),
  new THREE.MeshLambertMaterial({color:0x57813A}));
praca.rotation.x=-Math.PI/2; praca.position.set(PR.x,0.16,PR.z); praca.receiveShadow=true;
scene.add(praca);
// caminhos diagonais + obelisco
for(const a of [Math.PI/4,-Math.PI/4]){
  const c=new THREE.Mesh(new THREE.PlaneGeometry(140,6),
    new THREE.MeshLambertMaterial({color:0xB9AE95}));
  c.rotation.x=-Math.PI/2; c.rotation.z=a; c.position.set(PR.x,0.18,PR.z); scene.add(c);
}
const obelisco = new THREE.Mesh(new THREE.CylinderGeometry(1.2,2.6,18,4),
  new THREE.MeshLambertMaterial({color:0xE7E2D4}));
obelisco.position.set(PR.x,9,PR.z); obelisco.castShadow=true; scene.add(obelisco);

// --- Catedral N. Sra. da Conceição (ao sul da avenida, frente à praça) ---
const CAT = {x:PR.x, z:AVENIDA_L/2 + 8 + BLOCO/2};
zonasLivres.push({x:CAT.x, z:CAT.z, rx:70, rz:70});
(function catedral(){
  const g = new THREE.Group();
  const branco = new THREE.MeshLambertMaterial({color:0xF2EEE2});
  // nave em "A" (prisma triangular)
  const tri = new THREE.Shape();
  tri.moveTo(-22,0); tri.lineTo(22,0); tri.lineTo(0,30); tri.closePath();
  const nave = new THREE.Mesh(new THREE.ExtrudeGeometry(tri,{depth:56,bevelEnabled:false}), branco);
  nave.rotation.y = Math.PI/2; nave.position.set(-28,0,0);
  nave.castShadow = nave.receiveShadow = true;
  g.add(nave);
  // vitral frontal
  const vitral = new THREE.Mesh(new THREE.PlaneGeometry(16,20),
    new THREE.MeshBasicMaterial({color:0xF7B733}));
  vitral.position.set(-28.5,11,0); vitral.rotation.y=-Math.PI/2; g.add(vitral);
  // campanário
  const torre = new THREE.Mesh(new THREE.BoxGeometry(7,58,7), branco);
  torre.position.set(20,29,-20); torre.castShadow=true; g.add(torre);
  const cruz1 = new THREE.Mesh(new THREE.BoxGeometry(0.9,12,0.9), branco);
  cruz1.position.set(20,64,-20); g.add(cruz1);
  const cruz2 = new THREE.Mesh(new THREE.BoxGeometry(6,0.9,0.9), branco);
  cruz2.position.set(20,66,-20); g.add(cruz2);
  // adro
  const adro = new THREE.Mesh(new THREE.PlaneGeometry(100,100),
    new THREE.MeshLambertMaterial({color:0xB9AE95}));
  adro.rotation.x=-Math.PI/2; adro.position.y=0.17; adro.receiveShadow=true; g.add(adro);
  g.position.set(CAT.x,0,CAT.z);
  scene.add(g);
})();

// --- Campus da UFGD (sudeste, borda da cidade) ---
const UF = {x:LIM_X-200, z:LIM_Z-160};
zonasLivres.push({x:UF.x, z:UF.z, rx:230, rz:180});
(function ufgd(){
  const grama = new THREE.Mesh(new THREE.PlaneGeometry(440,330),
    new THREE.MeshLambertMaterial({color:0x4E7C33}));
  grama.rotation.x=-Math.PI/2; grama.position.set(UF.x,0.15,UF.z); grama.receiveShadow=true;
  scene.add(grama);
  const matBloco = new THREE.MeshLambertMaterial({color:0xD9D3C4});
  const matFaixa = new THREE.MeshLambertMaterial({color:0x1B6E4A});
  for(let i=0;i<6;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(90,9,22), matBloco);
    b.position.set(UF.x-140+ (i%3)*130, 4.5, UF.z-70 + Math.floor(i/3)*130);
    b.castShadow=b.receiveShadow=true; scene.add(b);
    const f=new THREE.Mesh(new THREE.BoxGeometry(90.4,2.2,22.4), matFaixa);
    f.position.copy(b.position); f.position.y=9.5; scene.add(f);
  }
})();

// Reserva a faixa da segunda avenida
zonasLivres.push({x:AV2_X, z:0, rx:14, rz:LIM_Z+100});

// ============================================================
// EDIFÍCIOS — instancing com cor por instância
// ============================================================
const MAX_PREDIOS = 5200;
const geoPredio = new THREE.BoxGeometry(1,1,1);
geoPredio.translate(0,0.5,0);
const matPredio = new THREE.MeshLambertMaterial({color:0xffffff});
const predios = new THREE.InstancedMesh(geoPredio, matPredio, MAX_PREDIOS);
predios.castShadow = predios.receiveShadow = true;

const geoTelhado = new THREE.BoxGeometry(1,1,1);
geoTelhado.translate(0,0.5,0);
const telhados = new THREE.InstancedMesh(geoTelhado,
  new THREE.MeshLambertMaterial({color:0xffffff}), MAX_PREDIOS);
telhados.castShadow = true;

const paleta = [0xEFE7D6,0xE4D6BC,0xD8CFC0,0xF1EDE3,0xC9BFA8,0xE9DDC8,0xDCCFB4];
const paletaTorre = [0x9FB4C4,0x8AA3B8,0xB6C4CE,0x7E97AC];
const corTelha = new THREE.Color(0xA6402B);
const M = new THREE.Matrix4(), P = new THREE.Vector3(),
      Q = new THREE.Quaternion(), E = new THREE.Vector3();
let nP=0, nT=0;

for(let i=0;i<NX;i++) for(let j=0;j<NZ;j++){
  const bx=-LIM_X+PASSO/2+i*PASSO, bz=-LIM_Z+PASSO/2+j*PASSO;
  if(Math.abs(bz)<AVENIDA_L/2+8) continue;
  if(livre(bx,bz)) continue;
  const distCentro = Math.hypot(bx, bz)/PASSO;
  // lotes 3x3 por quadra
  for(let u=0;u<3;u++) for(let v=0;v<3;v++){
    if(nP>=MAX_PREDIOS) break;
    const x=bx-BLOCO/2+16+u*34+(rnd()-0.5)*6;
    const z=bz-BLOCO/2+16+v*34+(rnd()-0.5)*6;
    if(livre(x,z)) continue;
    const pertoAv = Math.abs(bz)<PASSO*1.6;
    const centro = distCentro<2.6;
    let h;
    const r=rnd();
    if(centro && r>0.9)      h=40+rnd()*55;   // torres do centro
    else if(centro && r>0.6) h=12+rnd()*18;   // comércio
    else if(pertoAv && r>0.85) h=18+rnd()*30;
    else if(r>0.94)          h=15+rnd()*20;   // torre isolada
    else                     h=3.5+rnd()*4.5; // casas
    const w=14+rnd()*14, d=14+rnd()*14;
    P.set(x,0,z); Q.identity(); E.set(w,h,d);
    M.compose(P,Q,E);
    predios.setMatrixAt(nP, M);
    const torre = h>14;
    const cor = new THREE.Color(torre
      ? paletaTorre[(nP+i)%paletaTorre.length]
      : paleta[(nP+j)%paleta.length]);
    cor.offsetHSL(0,(rnd()-0.5)*0.03,(rnd()-0.5)*0.05);
    predios.setColorAt(nP, cor);
    nP++;
    if(!torre){ // telhado de telha nas casas
      P.set(x,h,z); E.set(w*1.12,1.6,d*1.12); M.compose(P,Q,E);
      telhados.setMatrixAt(nT,M);
      telhados.setColorAt(nT, corTelha.clone().offsetHSL(0,0,(rnd()-0.5)*0.06));
      nT++;
    }
  }
}
predios.count=nP; telhados.count=nT;
if(predios.instanceColor) predios.instanceColor.needsUpdate=true;
if(telhados.instanceColor) telhados.instanceColor.needsUpdate=true;
predios.instanceMatrix.needsUpdate = true;
telhados.instanceMatrix.needsUpdate = true;
scene.add(predios, telhados);

// ============================================================
// IPÊS — a assinatura de Dourados (amarelos e rosas)
// ============================================================
const MAX_IPES = 900;
const troncoGeo = new THREE.CylinderGeometry(0.5,0.9,5,6); troncoGeo.translate(0,2.5,0);
const copaGeo = new THREE.IcosahedronGeometry(4.2,1); copaGeo.translate(0,7.5,0);
const troncos = new THREE.InstancedMesh(troncoGeo,
  new THREE.MeshLambertMaterial({color:0x5B4632}), MAX_IPES);
const copas = new THREE.InstancedMesh(copaGeo,
  new THREE.MeshLambertMaterial({color:0xffffff}), MAX_IPES);
copas.castShadow = true;
let nI=0;
const corIpe=[new THREE.Color(0xFFC63D), new THREE.Color(0xE96FA8), new THREE.Color(0x5E8C3F)];
function planta(x,z,s=1){
  if(nI>=MAX_IPES) return;
  P.set(x,0,z); Q.setFromAxisAngle(new THREE.Vector3(0,1,0), rnd()*6.28);
  E.setScalar(0.7+rnd()*0.7*s);
  M.compose(P,Q,E);
  troncos.setMatrixAt(nI,M); copas.setMatrixAt(nI,M);
  const r=rnd();
  copas.setColorAt(nI, corIpe[r>0.62?0 : r>0.3?2 : 1]); // maioria amarelos e verdes, alguns rosas
  nI++;
}
// canteiro da avenida
for(let x=-LIM_X-80;x<LIM_X+80;x+=26) planta(x+(rnd()-0.5)*6, (rnd()-0.5)*4, 0.9);
// parque do lago
for(let k=0;k<130;k++){ const a=rnd()*6.28, r=155+rnd()*90;
  planta(PQ.x+Math.cos(a)*r*1.2, PQ.z+Math.sin(a)*r*0.85); }
// praça e catedral
for(let k=0;k<16;k++){ const a=rnd()*6.28;
  planta(PR.x+Math.cos(a)*(38+rnd()*14), PR.z+Math.sin(a)*(38+rnd()*14)); }
// espalhados na malha
for(let k=0;k<420;k++){
  const x=(rnd()-0.5)*2*LIM_X, z=(rnd()-0.5)*2*LIM_Z;
  if(Math.abs(z)<AVENIDA_L/2+6) continue;
  planta(x,z,0.8);
}
troncos.count=copas.count=nI;
if(copas.instanceColor) copas.instanceColor.needsUpdate=true;
troncos.instanceMatrix.needsUpdate=copas.instanceMatrix.needsUpdate=true;
scene.add(troncos, copas);

// ============================================================
// PERIFERIA RURAL — lavouras e estradas de terra vermelha
// ============================================================
(function lavouras(){
  const cores=[0xB7A23C,0x8FA23A,0x6E8C36,0xC2B04A,0x7A6A3C];
  const g=new THREE.PlaneGeometry(1,1);
  for(let k=0;k<90;k++){
    const talhao=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:cores[k%cores.length]}));
    const ang=rnd()*6.28, r=Math.max(LIM_X,LIM_Z)+300+rnd()*2200;
    talhao.rotation.x=-Math.PI/2;
    talhao.position.set(Math.cos(ang)*r,-0.1,Math.sin(ang)*r);
    talhao.scale.set(300+rnd()*500, 220+rnd()*420, 1);
    scene.add(talhao);
  }
  // estradas vicinais de terra
  const terra=new THREE.MeshLambertMaterial({color:0x9C4A2F});
  for(const ang of [0.3,1.4,2.6,3.9,5.1]){
    const e=new THREE.Mesh(new THREE.PlaneGeometry(3600,12), terra);
    e.rotation.x=-Math.PI/2; e.rotation.z=ang;
    e.position.set(Math.cos(ang+1.57)*2100,0.02,Math.sin(ang+1.57)*2100);
    scene.add(e);
  }
})();

// ============================================================
// TRÁFEGO na Marcelino Pires e na Hayel Bon Faker
// ============================================================
const carros=[]; const carroGeo=new THREE.BoxGeometry(4.4,1.7,2.2); carroGeo.translate(0,0.85,0);
const coresCarro=[0xD9D9D9,0xC0392B,0x2C3E50,0xF0F0F0,0x7F8C8D,0xF39C12];
for(let k=0;k<44;k++){
  const c=new THREE.Mesh(carroGeo,
    new THREE.MeshLambertMaterial({color:coresCarro[k%coresCarro.length]}));
  c.castShadow=true;
  const ns = k>=32; // 12 carros na avenida norte-sul
  const sentido = k%2?1:-1;
  c.userData={ns, sentido, v:(0.35+rnd()*0.3)*sentido,
    pos:(rnd()-0.5)*2*(ns?LIM_Z:LIM_X)};
  if(ns){ c.rotation.y=Math.PI/2; c.position.x=AV2_X+(sentido>0?5:-5); }
  else  { c.position.z=(sentido>0? AVENIDA_L/2-9 : -AVENIDA_L/2+9); }
  scene.add(c); carros.push(c);
}
// leito da segunda avenida
const av2=new THREE.Mesh(new THREE.PlaneGeometry(26, NZ*PASSO+220),
  new THREE.MeshLambertMaterial({color:0x36363C}));
av2.rotation.x=-Math.PI/2; av2.position.set(AV2_X,0.08,0); scene.add(av2);

// ============================================================
// CÂMERA — órbita manual + sobrevoo
// ============================================================
const alvo=new THREE.Vector3(0,10,0);
let theta=-0.9, phi=0.42, dist=1250;
let modo='orbita'; // orbita | sobrevoo | livre
function aplicaCamera(){
  camera.position.set(
    alvo.x + dist*Math.cos(phi)*Math.cos(theta),
    alvo.y + dist*Math.sin(phi),
    alvo.z + dist*Math.cos(phi)*Math.sin(theta));
  camera.lookAt(alvo);
}
aplicaCamera();

let drag=null;
const el=renderer.domElement;
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,b:e.button};
  if(modo==='sobrevoo') setModo('livre'); });
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.b===2 || e.shiftKey){ // pan
    const k=dist*0.0012;
    const dir=new THREE.Vector3(Math.cos(theta),0,Math.sin(theta));
    const lado=new THREE.Vector3(-dir.z,0,dir.x);
    alvo.addScaledVector(lado,-dx*k).addScaledVector(dir,dy*k);
  } else {
    theta+=dx*0.005; phi=Math.min(1.45,Math.max(0.08,phi+dy*0.004));
  }
  if(modo==='orbita') setModo('livre');
  aplicaCamera();
});
el.addEventListener('wheel',e=>{
  dist=Math.min(4200,Math.max(80,dist*(1+Math.sign(e.deltaY)*0.09)));
  aplicaCamera();
},{passive:true});

// sobrevoo: waypoints [alvo x,z, theta, phi, dist]
const rota=[
  [-LIM_X-200,0, -2.6,0.30,900],
  [PQ.x,PQ.z,   -1.8,0.35,420],
  [PR.x,PR.z,   -0.7,0.30,260],
  [CAT.x,CAT.z,  0.4,0.26,220],
  [AV2_X,300,    1.2,0.34,520],
  [UF.x,UF.z,    2.0,0.38,480],
  [0,0,          2.9,0.55,1400],
];
let tRota=0;
function passoSobrevoo(dt){
  tRota=(tRota+dt*0.05)% rota.length;
  const i=Math.floor(tRota), f=tRota-i;
  const a=rota[i], b=rota[(i+1)%rota.length];
  const s=f*f*(3-2*f); // suavização
  alvo.x=a[0]+(b[0]-a[0])*s; alvo.z=a[1]+(b[1]-a[1])*s; alvo.y=14;
  let dth=b[2]-a[2]; if(dth>Math.PI) dth-=6.283; if(dth<-Math.PI) dth+=6.283;
  theta=a[2]+dth*s; phi=a[3]+(b[3]-a[3])*s; dist=a[4]+(b[4]-a[4])*s;
  aplicaCamera();
}

// ---------- Marcos: botões que voam até o local ----------
const marcos=[
  {nome:'Catedral N. Sra. da Conceição', cor:'#F3E9D8', x:CAT.x,z:CAT.z, d:230,ph:0.3},
  {nome:'Praça Antônio João',            cor:'#57813A', x:PR.x, z:PR.z,  d:240,ph:0.42},
  {nome:'Parque do Lago (Antenor Martins)',cor:'#2E7DA6',x:PQ.x,z:PQ.z,  d:520,ph:0.4},
  {nome:'Av. Marcelino Pires',           cor:'#FFC63D', x:0,   z:0,     d:640,ph:0.24},
  {nome:'Campus da UFGD',                cor:'#1B6E4A', x:UF.x,z:UF.z,   d:470,ph:0.4},
];
let voo=null;
const rotulo=document.getElementById('rotulo');
const painelMarcos=document.getElementById('marcos');
marcos.forEach(m=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="dot" style="background:${m.cor}"></span>${m.nome}`;
  b.onclick=()=>{ setModo('livre');
    voo={t:0, a:{x:alvo.x,z:alvo.z,th:theta,ph:phi,d:dist},
         b:{x:m.x,z:m.z,th:theta+0.6,ph:m.ph,d:m.d}, m};
  };
  painelMarcos.appendChild(b);
});
function passoVoo(dt){
  if(!voo) return;
  voo.t=Math.min(1,voo.t+dt*0.55);
  const s=voo.t*voo.t*(3-2*voo.t), a=voo.a,b=voo.b;
  alvo.x=a.x+(b.x-a.x)*s; alvo.z=a.z+(b.z-a.z)*s; alvo.y=12;
  theta=a.th+(b.th-a.th)*s; phi=a.ph+(b.ph-a.ph)*s; dist=a.d+(b.d-a.d)*s;
  aplicaCamera();
  if(voo.t>=1){
    // mostra rótulo sobre o marco
    const p=new THREE.Vector3(voo.m.x,30,voo.m.z).project(camera);
    rotulo.textContent=voo.m.nome;
    rotulo.style.left=((p.x*0.5+0.5)*innerWidth)+'px';
    rotulo.style.top =((-p.y*0.5+0.5)*innerHeight)+'px';
    rotulo.style.opacity=1;
    setTimeout(()=>rotulo.style.opacity=0, 2600);
    voo=null;
  }
}

// ---------- Modos ----------
const btns={sobrevoo:btnSobrevoo, orbita:btnOrbita, livre:btnLivre};
function setModo(m){ modo=m;
  for(const k in btns) btns[k].classList.toggle('ativo', k===m); }
btnSobrevoo.onclick=()=>setModo('sobrevoo');
btnOrbita.onclick =()=>setModo('orbita');
btnLivre.onclick  =()=>setModo('livre');

// ---------- Loop ----------
const clock=new THREE.Clock();
const reduzMov = matchMedia('(prefers-reduced-motion: reduce)').matches;
function anim(){
  requestAnimationFrame(anim);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!reduzMov){
    for(const c of carros){
      c.userData.pos+=c.userData.v*dt*60;
      const L=c.userData.ns?LIM_Z:LIM_X;
      if(c.userData.pos> L+140) c.userData.pos=-L-140;
      if(c.userData.pos<-L-140) c.userData.pos= L+140;
      if(c.userData.ns) c.position.z=c.userData.pos;
      else              c.position.x=c.userData.pos;
    }
  }
  if(modo==='orbita' && !reduzMov){ theta+=dt*0.06; aplicaCamera(); }
  if(modo==='sobrevoo' && !reduzMov) passoSobrevoo(dt);
  passoVoo(dt);
  renderer.render(scene,camera);
}
anim();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
